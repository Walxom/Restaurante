name: CI — Lint · Test (Node + Python) · Cold-Start · E2E · Build · Docker · SonarQube Cloud

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Job 1: Calidad de código, pruebas Node.js, Python IA y Cold-Start ───────
  quality:
    name: Lint + Pruebas Unitarias (Vitest + Pytest) + Setup
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Configurar Python 3.10 (Microservicio IA)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Instalar dependencias Node.js
        run: pnpm install --frozen-lockfile

      - name: Instalar dependencias Python (ai_engine)
        run: |
          python -m pip install --upgrade pip
          pip install -r ai_engine/requirements.txt

      - name: Generar cliente Prisma y sembrar base de datos
        run: pnpm db:setup
        env:
          DATABASE_URL: file:./dev.db

      - name: Ejecutar ESLint
        run: pnpm lint

      - name: Ejecutar pruebas unitarias TypeScript con cobertura (Vitest)
        run: pnpm test:coverage

      - name: Simulacro de caída abrupta durante escrituras (SQLite WAL)
        run: pnpm test:power-loss

      - name: Ejecutar pruebas del motor de Inteligencia Artificial (Pytest)
        run: python -m pytest ai_engine/tests

      - name: Validar fiabilidad de arranque en frío e idempotencia (pnpm test:setup)
        run: node scripts/test-setup-all.js

      - name: Publicar reporte de cobertura como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ─── Job 2: Pruebas E2E / aceptación + accesibilidad (Playwright + axe-core) ──
  e2e:
    name: E2E + Accesibilidad (Playwright)
    runs-on: ubuntu-24.04
    needs: quality

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma y sembrar base de datos
        run: pnpm db:setup
        env:
          DATABASE_URL: file:./dev.db

      - name: Instalar navegador Chromium para Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E y de accesibilidad
        run: pnpm test:e2e
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-secret-placeholder-minimum-32-chars' }}
          NEXTAUTH_URL: http://localhost:3001
          DATABASE_URL: file:./dev.db

      - name: Publicar reporte de Playwright como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ─── Job 3: Compilación de producción con caché ─────────────────────────────
  build:
    name: Build de producción Next.js
    runs-on: ubuntu-24.04
    needs: quality

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Restaurar caché de compilación de Next.js
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Generar cliente Prisma
        run: pnpm db:generate

      - name: Compilar aplicación Next.js
        run: pnpm build
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-secret-placeholder-minimum-32-chars' }}
          NEXTAUTH_URL: http://localhost:3001
          DATABASE_URL: file:./dev.db

      - name: Publicar artefacto de build
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          include-hidden-files: true
          retention-days: 3

  # ─── Job 4: Análisis estático y deuda técnica (SonarQube Cloud) ─────────────
  sonarcloud:
    name: SonarQube Cloud
    runs-on: ubuntu-24.04
    needs: quality
    # Los PRs desde forks no reciben el secreto; el análisis se omite sin fallar.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout del repositorio (historial completo para blame y código nuevo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar reporte de cobertura del job quality
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Escanear con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ─── Job 5: Despliegue con Docker Compose en Linux (prueba de humo) ──────────
  docker:
    name: Despliegue Docker (Linux)
    runs-on: ubuntu-24.04
    needs: quality

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Preparar .env desde la plantilla de despliegue
        run: |
          cp .env.docker.example .env
          sed -i "s|^NEXTAUTH_SECRET=.*|NEXTAUTH_SECRET=$(openssl rand -base64 32)|" .env

      - name: Construir y levantar los contenedores
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Verificar web, base de datos y motor de IA
        run: |
          docker compose ps
          curl -fsS http://localhost:3001/api/public/health | tee health.json
          grep -q '"database":{"engine":"sqlite","status":"up"' health.json
          grep -q '"aiEngine":{"enabled":true,"status":"up"' health.json
          curl -fsS -o /dev/null -w 'login %{http_code}\n' http://localhost:3001/login

      - name: Verificar que los datos persisten tras reiniciar
        run: |
          docker compose restart
          docker compose up -d --wait --wait-timeout 180
          docker compose exec -T siger-web sh -c 'test -s /data/prod.db && ls -la /data'
          curl -fsS http://localhost:3001/api/public/health

      - name: Registros de los contenedores
        if: always()
        run: docker compose logs --no-color --tail 200

      - name: Bajar los contenedores
        if: always()
        run: docker compose down -v

# SonarQube Cloud — SIGER-IA
# El análisis corre en el CI (job "SonarQube Cloud" de .github/workflows/ci.yml)
# con el secreto SONAR_TOKEN. El análisis automático de SonarCloud está desactivado.

sonar.organization=walxom
sonar.projectKey=Walxom_Restaurante
sonar.projectName=SIGER-IA
sonar.projectVersion=1.1.0

# Código fuente de la app web (el motor de IA en Python queda fuera del análisis)
sonar.sources=src
sonar.exclusions=**/__tests__/**,**/node_modules/**,**/.next/**,**/coverage/**,src/services/printer/**

# Archivos de prueba
sonar.tests=src
sonar.test.inclusions=**/__tests__/**/*.test.ts,**/*.spec.ts

# Cobertura generada por pnpm test:coverage (job quality) y descargada como artefacto.
# Solo se mide sobre lo que cubre vitest.config.ts: servicios y validaciones.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.inclusions=src/services/**,src/features/**/validations/**

sonar.sourceEncoding=UTF-8

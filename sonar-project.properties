# SonarQube / SonarCloud — SIGER-IA
# Ejecutar: sonar-scanner (requiere SonarQube local o token de SonarCloud)

sonar.projectKey=siger-ia
sonar.projectName=SIGER-IA
sonar.projectVersion=1.0.0

# Código fuente (excluye node_modules, .next, prisma/migrations, ai_engine)
sonar.sources=src
sonar.exclusions=**/__tests__/**,**/node_modules/**,**/.next/**,**/coverage/**,src/services/printer/**

# Archivos de prueba
sonar.tests=src
sonar.test.inclusions=**/__tests__/**/*.test.ts,**/*.spec.ts

# Reporte de cobertura (generado por pnpm test:coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Configuración de lenguaje
sonar.language=ts
sonar.sourceEncoding=UTF-8

# Umbral de calidad (Quality Gate)
# - Cobertura de código nuevo: >= 80% (igual que vitest.config.ts)
# - Duplicación: <= 10%
# - Vulnerabilidades: 0
# - Code smells críticos: 0

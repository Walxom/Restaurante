# SonarQube Cloud — SIGER-IA
# El análisis corre en el CI (job "SonarQube Cloud" de .github/workflows/ci.yml)
# con el secreto SONAR_TOKEN. El análisis automático de SonarCloud está desactivado.
# SonarQube Cloud analiza todo el repositorio (app web, scripts, motor de IA y workflows).

sonar.organization=walxom
sonar.projectKey=Walxom_Restaurante
sonar.projectName=SIGER-IA
sonar.projectVersion=1.1.0

sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,src/services/printer/**
sonar.python.version=3.10

# Cobertura generada por pnpm test:coverage (job quality) y descargada como artefacto.
# Las pruebas unitarias cubren la lógica de negocio (servicios y validaciones), igual que
# el umbral de vitest.config.ts. Las páginas y componentes se prueban con Playwright (E2E),
# que no genera cobertura de líneas; por eso se excluyen del cálculo de cobertura.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/__tests__/**,**/*.test.ts,**/*.spec.ts,src/app/**,src/components/**,src/emails/**,src/hooks/**,src/lib/**,src/types/**,src/middleware.ts,src/features/**/components/**,src/features/**/hooks/**,src/features/**/types/**,src/features/**/utils/**,scripts/**,ai_engine/**,e2e/**,tests/**,prisma/**,*.js,*.mjs,*.ts

sonar.sourceEncoding=UTF-8

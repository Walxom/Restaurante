# SonarQube Cloud — SIGER-IA
# El análisis corre en el CI (job "SonarQube Cloud" de .github/workflows/ci.yml)
# con el secreto SONAR_TOKEN. El análisis automático de SonarCloud está desactivado.
# SonarQube Cloud analiza todo el repositorio (app web, scripts, motor de IA y workflows).

sonar.organization=walxom
sonar.projectKey=Walxom_Restaurante
sonar.projectName=SIGER-IA
sonar.projectVersion=1.1.0

sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,src/services/printer/**
sonar.python.version=3.10

# Cobertura generada por pnpm test:coverage (job quality) y descargada como artefacto.
# Las pruebas unitarias cubren la lógica de negocio (servicios y validaciones), igual que
# el umbral de vitest.config.ts. Las páginas y componentes se prueban con Playwright (E2E),
# que no genera cobertura de líneas; por eso se excluyen del cálculo de cobertura.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=siger.ps1,siger.sh,siger.cmd,**/__tests__/**,**/*.test.ts,**/*.spec.ts,src/app/**,src/components/**,src/emails/**,src/hooks/**,src/lib/**,src/types/**,src/middleware.ts,src/features/**/components/**,src/features/**/hooks/**,src/features/**/types/**,src/features/**/utils/**,scripts/**,ai_engine/**,e2e/**,tests/**,prisma/**,*.js,*.mjs,*.ts

# Excepción revisada: S5332 (protocolo sin cifrar). SIGER-IA corre en la red local del
# restaurante sin TLS por diseño (local-first, ver docs/installation/deployment-guide.md); los
# scripts de despliegue y el CI solo consultan http://localhost o la IP privada del servidor.
sonar.issue.ignore.multicriteria=http1,http2,http3
sonar.issue.ignore.multicriteria.http1.ruleKey=githubactions:S5332
sonar.issue.ignore.multicriteria.http1.resourceKey=.github/workflows/**
sonar.issue.ignore.multicriteria.http2.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.http2.resourceKey=siger.sh
sonar.issue.ignore.multicriteria.http3.ruleKey=powershell:S5332
sonar.issue.ignore.multicriteria.http3.resourceKey=siger.ps1

sonar.sourceEncoding=UTF-8
